[project]
name = "mac-gesture-control"
version = "0.1.0"
description = "Touchless pointer, click, drag, and scroll control for macOS using on-device computer vision"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
  # 1.0.1 aborts in DrishtiMetalHelper on macOS 26.6 / Apple M2.
  "mediapipe==0.10.35",
  "pyobjc-framework-ApplicationServices>=11.1,<13",
  "pyobjc-framework-Quartz>=11.1,<13",
]

[project.scripts]
gesture-mac = "gesture_mac_prototype.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_mac_prototype"]
